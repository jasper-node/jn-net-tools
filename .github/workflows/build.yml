name: Build and Bundle Binaries

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: false
        type: string

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build macOS Intel (x86_64)
        run: cargo build -p jnnt --release --target x86_64-apple-darwin

      - name: Build macOS Apple Silicon (aarch64)
        run: cargo build -p jnnt --release --target aarch64-apple-darwin

      - name: Prepare macOS binaries
        run: |
          mkdir -p dist/macos
          cp target/x86_64-apple-darwin/release/libjnnt.dylib dist/macos/libjnnt-x86_64.dylib
          cp target/aarch64-apple-darwin/release/libjnnt.dylib dist/macos/libjnnt-aarch64.dylib

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: dist/macos
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Npcap SDK
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $npcapUrl = "https://npcap.com/dist/npcap-sdk-1.13.zip"
          Invoke-WebRequest -Uri $npcapUrl -OutFile npcap-sdk.zip
          Expand-Archive -Path npcap-sdk.zip -DestinationPath C:\npcapsdk -Force
          echo "LIB=C:\npcapsdk\Lib\x64;$env:LIB" >> $env:GITHUB_ENV

      - name: Build Windows x86_64
        run: |
          cargo build -p jnnt --release --target x86_64-pc-windows-msvc

      - name: Prepare Windows binary
        run: |
          mkdir -p dist/windows
          cp target/x86_64-pc-windows-msvc/release/jnnt.dll dist/windows/libjnnt.dll

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: dist/windows
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    env:
      # Single source for both the build below and its backstop check.
      JN_GLIBC_FLOOR: "2.17"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      # Both Linux arches are built by scripts/build.ts, which links against the
      # JN_GLIBC_FLOOR above via cargo-zigbuild. A plain cargo/cross build
      # stamps the runner's glibc onto the library and it then fails to dlopen
      # on older-glibc field devices with `version GLIBC_2.xx not found`.
      # zig and cargo-zigbuild are pinned to the pair the JasperNode release
      # server is provisioned with, so both repos' cdylibs link identically.
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Build Linux x86_64
        run: deno run -A scripts/build.ts --release --target x86_64-unknown-linux-gnu

      - name: Build Linux ARM64
        run: deno run -A scripts/build.ts --release --target aarch64-unknown-linux-gnu

      # Backstop: proves the floor actually held, independent of the toolchain
      # that produced the libraries. Every branch below fails closed — a lib the
      # check cannot read is reported as unverified, never as clean.
      - name: Verify the glibc floor held
        shell: bash
        run: |
          set -uo pipefail
          floor="GLIBC_${JN_GLIBC_FLOOR}"
          status=0
          for lib in lib/jnnt-x86_64.so lib/jnnt-aarch64.so; do
            tags=$(readelf -V "$lib" | grep -oE 'GLIBC_[A-Za-z0-9_.]+' | sort -u)
            if [ -z "$tags" ]; then
              echo "::error::$lib exposed no GLIBC_* requirements — unreadable, so treat it as unverified"
              status=1
              continue
            fi
            # Loader ABIs such as GLIBC_ABI_DT_RELR are not comparable versions;
            # a floor-era loader simply does not provide them.
            abi=$(printf '%s\n' "$tags" \
                  | grep -vE '^(GLIBC_[0-9]+(\.[0-9]+)+|GLIBC_PRIVATE)$' || true)
            if [ -n "$abi" ]; then
              echo "::error::$lib requires loader ABI $(printf '%s' "$abi" | tr '\n' ' ') — a $floor loader does not provide it"
              status=1
              continue
            fi
            versions=$(printf '%s\n' "$tags" | grep -E '^GLIBC_[0-9]+(\.[0-9]+)+$')
            # Sorting the floor in with the requirements: it stays last only
            # when nothing needs anything newer.
            max=$(printf '%s\n%s\n' "$versions" "$floor" | sort -u -V | tail -1)
            echo "$lib requires up to $(printf '%s\n' "$versions" | sort -V | tail -1)"
            if [ "$max" != "$floor" ]; then
              echo "::error::$lib requires $max, above the $floor floor — it would fail to dlopen on older-glibc devices"
              status=1
            fi
          done
          exit $status

      - name: Prepare Linux binaries
        run: |
          mkdir -p dist/linux
          cp lib/jnnt-x86_64.so dist/linux/libjnnt-x86_64.so
          cp lib/jnnt-aarch64.so dist/linux/libjnnt-aarch64.so

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/linux
          retention-days: 7

  bundle:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS binaries
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: dist/artifacts/macos

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: dist/artifacts/windows

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist/artifacts/linux

      - name: Organize binaries
        run: |
          mkdir -p dist/libs/{linuxA64,linux64,mac64,macA64,win64}

          # Organize macOS binaries
          cp dist/artifacts/macos/libjnnt-x86_64.dylib dist/libs/mac64/libjnnt.dylib
          cp dist/artifacts/macos/libjnnt-aarch64.dylib dist/libs/macA64/libjnnt.dylib

          # Organize Linux binaries
          cp dist/artifacts/linux/libjnnt-x86_64.so dist/libs/linux64/libjnnt.so
          cp dist/artifacts/linux/libjnnt-aarch64.so dist/libs/linuxA64/libjnnt.so

          # Organize Windows binary
          cp dist/artifacts/windows/libjnnt.dll dist/libs/win64/

      - name: Create bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundled-binaries
          path: dist/libs
          retention-days: 30

      - name: List bundled files
        run: |
          echo "Bundled binaries structure:"
          find dist/libs -type f -name "*.so" -o -name "*.dll" -o -name "*.dylib" | sort

      - name: Prepare lib/ folder structure for JSR
        run: |
          mkdir -p dist/lib-jsr
          cp dist/libs/mac64/libjnnt.dylib dist/lib-jsr/jnnt-x86_64.dylib
          cp dist/libs/macA64/libjnnt.dylib dist/lib-jsr/jnnt-aarch64.dylib
          cp dist/libs/linux64/libjnnt.so dist/lib-jsr/jnnt-x86_64.so
          cp dist/libs/linuxA64/libjnnt.so dist/lib-jsr/jnnt-aarch64.so
          cp dist/libs/win64/libjnnt.dll dist/lib-jsr/jnnt.dll

      - name: Create release archive
        run: |
          cd dist/lib-jsr
          tar -czf ../lib-binaries.tar.gz .
          cd ../..

      - name: Extract version from tag
        id: tag_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag_version.outputs.version }}
          name: Release ${{ steps.tag_version.outputs.version }}
          body: |
            Pre-compiled FFI binaries for all platforms.

            ## Binaries included:
            - macOS (x86_64): `jnnt-x86_64.dylib`
            - macOS (aarch64): `jnnt-aarch64.dylib`
            - Linux (x86_64): `jnnt-x86_64.so`
            - Linux (aarch64): `jnnt-aarch64.so`
            - Windows (x86_64): `jnnt.dll`

            Extract the archive and copy the appropriate binary to `lib/` folder:
            - macOS: Use `jnnt-x86_64.dylib` or `jnnt-aarch64.dylib` → rename to `libjnnt.dylib`
            - Linux: Use `jnnt-x86_64.so` or `jnnt-aarch64.so` → rename to `libjnnt.so`
            - Windows: Use `jnnt.dll` → rename to `libjnnt.dll`
          files: dist/lib-binaries.tar.gz
          draft: false
          prerelease: ${{ contains(steps.tag_version.outputs.version, '-') || contains(steps.tag_version.outputs.version, 'beta') || contains(steps.tag_version.outputs.version, 'alpha') }}
